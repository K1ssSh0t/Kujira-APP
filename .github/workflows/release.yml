# Publica un APK Android como release `vX.Y.Z`.
#
# Contrato para que la app pueda actualizarse in-place:
# - package fijo: com.anonymous.KujiraAPP;
# - misma firma que el APK instalado;
# - versionCode creciente (github.run_number, mínimo 2);
# - asset exacto: kujira-app-vX.Y.Z.apk.
#
# El primer release con updater (v1.6.0) se instala manualmente. Desde ahí,
# la app puede descargar e instalar los siguientes releases.
# Ver lib/updater/README.md para el flujo completo.
name: Build Android App Locally and Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Versión a publicar (ej. 1.6.0). Si se omite, usa package.json."
        required: false
        type: string
  push:
    tags:
      - "v*"

# El build no publica nada; el job create-release pide contents: write.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      version_code: ${{ steps.meta.outputs.version_code }}
    steps:
      - name: Free disk space (fix No space left on device)
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: false
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type check
        run: bunx tsc --noEmit

      # Prioridad de versión: input manual > tag vX.Y.Z > package.json.
      # El versionCode no sale del semver: usa el run_number para que cada
      # release tenga un código mayor que el anterior.
      - name: Resolve version
        id: meta
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail

          if [ -n "${INPUT_VERSION:-}" ]; then
            VERSION="$INPUT_VERSION"
          elif [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
          else
            VERSION="$(node -p "require('./package.json').version")"
          fi

          VERSION="${VERSION#v}"
          if ! echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Versión inválida: '$VERSION'. Usá el formato X.Y.Z."
            exit 1
          fi

          # versionCode tiene que ser siempre mayor al del APK instalado.
          # github.run_number es monotónico por repositorio; el mínimo 2 evita
          # que la primera ejecución quede igual al versionCode actual (1).
          VERSION_CODE="$RUN_NUMBER"
          if [ "$VERSION_CODE" -lt 2 ]; then
            VERSION_CODE=2
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "Publicando v$VERSION (versionCode $VERSION_CODE)"

      # Sincroniza el manifiesto de Expo y package.json con la versión del
      # release. El APK embebido es el que luego lee `Constants.expoConfig`.
      - name: Sync app version
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          VERSION_CODE: ${{ steps.meta.outputs.version_code }}
        run: |
          node - <<'NODE'
          const fs = require('fs');

          const version = process.env.VERSION;
          const versionCode = Number(process.env.VERSION_CODE);

          const app = JSON.parse(fs.readFileSync('app.json', 'utf8'));
          app.expo.version = version;
          app.expo.android = {
            ...(app.expo.android ?? {}),
            versionCode,
          };
          fs.writeFileSync('app.json', JSON.stringify(app, null, 2) + '\n');

          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          pkg.version = version;
          fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');

          console.log(`app.json/package.json sincronizados a v${version} (${versionCode})`);
          NODE

      # El modulo nativo local en ./modules/video-proxy se auto-enlaza durante el
      # prebuild (expo-modules-autolinking lo detecta via package.json > expo.autolinking).
      - name: Generate Android project
        run: bunx expo prebuild -p android --no-install

      - name: Verify local native modules are linked
        run: bunx expo-modules-autolinking search -p android

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          # 'tools' is obsolete and was removed from Google's repo (sdkmanager
          # fails with "Failed to find package 'tools'"). Override the action
          # defaults to install only what the build needs.
          packages: platform-tools

      - name: Build Android Release APK
        run: |
          set -euo pipefail
          cd android
          ./gradlew assembleRelease

      - name: Find Android APK
        id: find_apk
        run: |
          set -euo pipefail
          APK_PATH="$(find ./android/app/build/outputs/apk/release -name '*.apk' -print -quit)"
          if [ -z "$APK_PATH" ]; then
            echo "No se encontró ningún APK de release."
            exit 1
          fi
          echo "APK_PATH=$APK_PATH" >> "$GITHUB_OUTPUT"

      # Este nombre es parte del contrato con lib/updater/github.ts.
      - name: Rename APK
        run: cp "${{ steps.find_apk.outputs.APK_PATH }}" "kujira-app-v${{ steps.meta.outputs.version }}.apk"

      - name: Verify APK signature
        env:
          # Firma actual (Android Debug). Si cambia, Android rechaza la
          # actualización por "firma incompatible". Si algún día se migra a una
          # keystore de release, hay que actualizar este valor y avisar a los
          # usuarios que reinstalen una vez.
          EXPECTED_SHA256: "FA:C6:17:45:DC:09:03:78:6F:B9:ED:E6:2A:96:2B:39:9F:73:48:F0:BB:6F:89:9B:83:32:66:75:91:03:3B:9C"
        run: |
          set -euo pipefail

          APK="kujira-app-v${{ steps.meta.outputs.version }}.apk"
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          APKSIGNER="$(find "${SDK_ROOT}/build-tools" -name apksigner -type f 2>/dev/null | sort -V | tail -n 1 || true)"
          if [ -z "$APKSIGNER" ]; then
            echo "No se encontró apksigner en ${SDK_ROOT}/build-tools"
            exit 1
          fi

          if ! SIGNATURE_INFO="$("$APKSIGNER" verify --print-certs "$APK")"; then
            echo "ERROR: apksigner no pudo verificar la firma del APK."
            exit 1
          fi
          echo "$SIGNATURE_INFO"

          # apksigner imprime el digest en minúsculas y sin ":"; normalizamos
          # ambos lados para que el chequeo funcione en cualquier formato.
          EXPECTED_NORMALIZED="$(echo "$EXPECTED_SHA256" | tr -d ':' | tr '[:upper:]' '[:lower:]')"
          ACTUAL_NORMALIZED="$(echo "$SIGNATURE_INFO" | tr -d ':' | tr '[:upper:]' '[:lower:]')"

          if ! echo "$ACTUAL_NORMALIZED" | grep -q "$EXPECTED_NORMALIZED"; then
            echo "ERROR: la firma del APK cambió."
            echo "Los APK nuevos no se podrán instalar encima de los existentes."
            echo "Esperado: $EXPECTED_SHA256"
            exit 1
          fi

      # Estas tres verificaciones, junto con la firma, son las que garantizan
      # que Android trate el APK como actualización y no como app aparte.
      - name: Verify APK package and version
        env:
          EXPECTED_PACKAGE: "com.anonymous.KujiraAPP"
          EXPECTED_VERSION: ${{ steps.meta.outputs.version }}
          EXPECTED_VERSION_CODE: ${{ steps.meta.outputs.version_code }}
        run: |
          set -euo pipefail

          APK="kujira-app-v${{ steps.meta.outputs.version }}.apk"
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          AAPT2="$(find "${SDK_ROOT}/build-tools" -name aapt2 -type f 2>/dev/null | sort -V | tail -n 1 || true)"
          if [ -z "$AAPT2" ]; then
            echo "No se encontró aapt2 en ${SDK_ROOT}/build-tools"
            exit 1
          fi

          BADGING="$("$AAPT2" dump badging "$APK" | sed -n '1p')"
          echo "$BADGING"

          if ! echo "$BADGING" | grep -Fq "package: name='${EXPECTED_PACKAGE}'"; then
            echo "ERROR: el package del APK no es ${EXPECTED_PACKAGE}."
            echo "Cambiarlo haría que la actualización se instale como otra app."
            exit 1
          fi
          if ! echo "$BADGING" | grep -Fq " versionCode='${EXPECTED_VERSION_CODE}'"; then
            echo "ERROR: la versionCode del APK no es ${EXPECTED_VERSION_CODE}."
            echo "Android necesita una versionCode mayor para aceptar la actualización."
            exit 1
          fi
          if ! echo "$BADGING" | grep -Fq " versionName='${EXPECTED_VERSION}'"; then
            echo "ERROR: la versionName del APK no es ${EXPECTED_VERSION}."
            exit 1
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: kujira-app-v${{ steps.meta.outputs.version }}.apk
          if-no-files-found: error

  # Sólo este job necesita escribir: crea el tag/release y sube el APK.
  create-release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download APK Artifact
        uses: actions/download-artifact@v4
        with:
          name: android-apk

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.build.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Kujira APP v${{ needs.build.outputs.version }}
          body: |
            ## Kujira APP v${{ needs.build.outputs.version }}

            APK de Android generado automáticamente.

            - `versionCode`: ${{ needs.build.outputs.version_code }}
            - Instalación: descargá el APK y confirmá la instalación en Android.
          files: kujira-app-v${{ needs.build.outputs.version }}.apk
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
