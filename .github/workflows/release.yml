name: Build Android App Locally and Release

on:
  push:
    branches: ["main"]
jobs:
  build-android-local:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build Android Release APK
        run: |
          cd android
          ./gradlew assembleRelease
          cd ..

      - name: Find Android APK
        id: find_apk
        run: echo "APK_PATH=$(find ./android/app/build/outputs/apk/release -name "*.apk" | head -n 1)" >> $GITHUB_OUTPUT

      - name: Upload Android APK to Release
        uses: actions/upload-release-asset@v1
        if: steps.find_apk.outputs.APK_PATH != ''
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ github.event.release.upload_url }}
          asset_path: ${{ steps.find_apk.outputs.APK_PATH }}
          asset_name: app-android-unsigned.apk
          asset_content_type: application/vnd.android.package-archive